<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oriel</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#14233a">
  <script type="module" src="./src/main.ts"></script>
</head>
<body data-state="starting">
  <div id="loading">
    <div class="loading-art">
      <img class="loading-logo" src="/oriel-logo.svg" alt="" width="168" height="90">
      <img class="loading-cover" alt="" hidden>
    </div>
    <div class="loading-info">
      <span class="loading-title"></span>
      <div class="loading-bar" role="progressbar" aria-label="Downloading the book" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Loading the book&hellip;"><span></span></div>
      <span class="loading-line" aria-hidden="true">Loading the book&hellip;</span>
    </div>
  </div>
  <p id="status" role="status"></p>
  <div id="book"></div>
</body>
</html>
