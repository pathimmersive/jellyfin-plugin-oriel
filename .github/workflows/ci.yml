name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/reader/package-lock.json
      # Building the plugin runs npm ci and the reader build, then embeds it.
      - run: dotnet test
      - run: bash scripts/test-package.sh
      - run: npm --prefix src/reader test
      - run: bash scripts/check-community-files.sh

  # The smoke checks, WebKit's and Chromium's shares in parallel, each with its
  # own Jellyfin (ORIEL_SMOKE_BROWSERS in scripts/smoke-plugin.sh).
  smoke-browser:
    name: smoke-${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/reader/package-lock.json
      - run: npm ci
        working-directory: src/reader
      # The smoke script installs its browser itself; the runner also needs the
      # browser's system libraries. The runner's package mirror sometimes slows
      # to a crawl, so the script gives each of three attempts five minutes and
      # puts a different apt mirror first on each.
      - name: Install the browser's system libraries
        working-directory: src/reader
        run: bash ../../scripts/install-browser-deps.sh npx playwright install --with-deps ${{ matrix.browser }}
      - run: bash scripts/smoke-plugin.sh
        env:
          ORIEL_SMOKE_BROWSERS: ${{ matrix.browser }}

  # The required check: passes only when both shares pass. It runs even when one
  # fails, because a required check that is skipped counts as passed.
  smoke:
    needs: smoke-browser
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.smoke-browser.result }}" = "success" ] || { echo "smoke-webkit or smoke-chromium did not pass: ${{ needs.smoke-browser.result }}"; exit 1; }'
